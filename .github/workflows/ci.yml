name: CI

# Pull requests stay the only source of the six required checks: branch
# protection rejects direct pushes to main, so a push trigger would only
# duplicate the run the PR already did — twice the CI jobs on the free
# tier, plus duplicate check-run names that can block auto-merge when one
# copy flakes (seen on PR #30). The weekly schedule and manual dispatch
# close the remaining gap: nothing else re-tests main between PRs, and
# runner/dependency drift can invalidate a green merge commit weeks later.
# This keeps CONTRIBUTING's "main green and releasable" claim directly
# verified — releases tag from main. Tag pushes are covered by the
# tag-check and Release workflows.
on:
  pull_request:
  schedule:
    - cron: "40 4 * * 1"   # Mondays 04:40 UTC — after repro's 03:20 probe
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy (py39 target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff (py39 target — flags 3.12-only syntax and dead code)
        run: ruff check .
      - name: mypy (python_version = 3.9 typeshed)
        run: mypy

  lint-py39:
    name: ruff + stdlib drift (py3.9 interpreter)
    # The floor version must keep working, not just parse. ruff's py39
    # target already rejects 3.10+ syntax; vermin adds the other half:
    # stdlib API/signature drift (e.g. Path.write_text(newline=) is 3.10+
    # and broke every export on 3.9 while passing every 3.12 gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
      - name: Install (proves the dev toolchain itself is 3.9-installable)
        run: pip install -e ".[dev]"
      - name: ruff (executed by the 3.9 interpreter)
        run: python -m ruff check .
      - name: vermin (stdlib signature drift vs the 3.9 floor)
        run: vermin -t=3.9- --violations --no-tips idm tests bench portable_zip.py

  test:
    name: pytest (py${{ matrix.python-version }})
    # windows-first desktop app: Tk tests, registry env mirror, ProgramFiles
    # player paths all expect Windows; ubuntu runners have no display.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (under coverage)
        run: python -m coverage run -m pytest tests -q
      - name: Coverage gate (fail_under = 80, package only)
        run: python -m coverage report
      - name: Coverage XML
        if: always()
        shell: bash
        run: |
          if [ -f .coverage ]; then
            python -m coverage xml -o "coverage-py${{ matrix.python-version }}.xml"
          else
            echo "no coverage data produced"
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.xml
          if-no-files-found: ignore
