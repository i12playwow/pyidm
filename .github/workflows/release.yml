name: Release

# Rebuild the portable bundle from source and prove it works BEFORE anything
# is published — never ship a stale committed zip.
#
# Runs on:
#   * version tags (v*)  -> build + smoke test + upload + GitHub release
#   * workflow_dispatch  -> build + smoke test only (pre-tag dry run)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release + push the zip-sync branch
  pull-requests: write # open the zip-sync PR and enable auto-merge on it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build + smoke test portable bundle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 3.12.x must match VER in build_portable.bat (the embeddable zip it
      # downloads). setup-python is also the Tk source install: PY312 points
      # build_portable.bat at it (the script defaults to a developer's
      # LOCALAPPDATA layout otherwise).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Gate before anything builds or publishes: the tag must match the
      # package version (same script as the tag-check workflow).
      - name: Verify tag matches idm/__init__.py version
        shell: bash
        run: python scripts/check_tag_version.py

      - name: Build portable bundle
        shell: bash
        run: |
          PY312="$(cygpath -w "$(dirname "$(command -v python)")")"
          echo "PY312=$PY312"
          PY312="$PY312" cmd //c build_portable.bat

      - name: Smoke-test the fresh bundle (not a committed artifact)
        shell: bash
        run: |
          cd portable/PyIDM
          sh smoke_test.sh

      - name: Assert zip has a stable PyIDM/ root
        shell: bash
        run: |
          python -c "import zipfile; n = zipfile.ZipFile('portable/PyIDM-portable.zip').namelist(); assert n and all(x.startswith('PyIDM/') for x in n), n[:5]; print('zip root ok:', len(n), 'files')"

      - name: Upload zip as workflow artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: PyIDM-portable-${{ github.ref_name }}
          path: portable/PyIDM-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: portable/PyIDM-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  # After a successful publish, commit the exact published zip back to the
  # repo so portable/PyIDM-portable.zip always matches the latest release.
  # Branch protection rejects direct pushes to main, so this lands via a PR
  # with GitHub-native auto-merge enabled: the PR merges itself once the six
  # required checks pass. Requires the repo setting "Allow auto-merge"
  # (enabled once in repo settings; not settable by GITHUB_TOKEN).
  # Note: CI does not start on a PR opened by github-actions[bot] until a
  # maintainer approves its run once; the job prints the approve link and
  # records it in the run summary so the pause is never silent.
  sync-repo-zip:
    name: sync committed zip with the published release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the published zip from the release job
        uses: actions/download-artifact@v4
        with:
          name: PyIDM-portable-${{ github.ref_name }}
          path: published

      - name: Commit the published zip to a sync branch
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp published/PyIDM-portable.zip portable/PyIDM-portable.zip
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("portable/PyIDM-portable.zip")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path("portable/PyIDM-portable.zip.sha256").write_text(f"{h}  PyIDM-portable.zip\n")
          print("published zip sha256:", h)
          PY
          BR="sync/portable-zip-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          if git diff --quiet; then
            echo "Repo zip already matches the release; nothing to sync."
            echo "NO_CHANGE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git add portable/PyIDM-portable.zip portable/PyIDM-portable.zip.sha256
          git commit -m "Sync portable/PyIDM-portable.zip with release ${VERSION}"
          git push -f origin "$BR"

      - name: Open a PR and enable auto-merge
        if: env.NO_CHANGE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          tok = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["VERSION"]
          branch = f"sync/portable-zip-{version}"
          H = {"Authorization": f"Bearer {tok}",
               "Accept": "application/vnd.github+json",
               "Content-Type": "application/json"}

          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(f"https://api.github.com{path}",
                                           data=data, headers=H, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]

          head = f"{repo.split('/')[0]}:{branch}"
          status, prs = api("GET", f"/repos/{repo}/pulls?state=open&head={head}")
          if status == 200 and prs:
              number = prs[0]["number"]
              print(f"reusing existing PR #{number}")
          else:
              status, pr = api("POST", f"/repos/{repo}/pulls", {
                  "title": f"Sync portable/PyIDM-portable.zip with release {version}",
                  "head": branch, "base": "main",
                  "body": ("Automated: commits the exact zip published in "
                           f"release {version} back to the repo, with the "
                           "regenerated sha256 sidecar. Auto-merge is enabled; "
                           "the PR lands itself when the six required checks pass.")})
              if status not in (200, 201):
                  raise SystemExit(f"PR create failed: {status} {pr}")
              number = pr["number"]
              print(f"opened PR #{number}")

          # Arm auto-merge while the PR is still pending checks. If the
          # checks raced ahead and the PR is already "clean", GitHub refuses
          # to arm it (verified: GraphQL reports "Pull request is in clean
          # status") — in that case there is nothing to wait for, so merge
          # the PR directly instead.
          status, resp = api("PUT", f"/repos/{repo}/pulls/{number}/auto-merge",
                             {"merge_method": "merge"})
          if status in (200, 202):
              print(f"auto-merge enabled on PR #{number}; "
                    "it lands when the six checks pass")
          elif status == 404:
              _, full = api("GET", f"/repos/{repo}/pulls/{number}")
              gql = json.dumps({
                  "query": ("mutation($id: ID!) { enablePullRequestAutoMerge("
                            "input: {pullRequestId: $id, mergeMethod: MERGE}) "
                            "{ clientMutationId } }"),
                  "variables": {"id": full["node_id"]}}).encode()
              greq = urllib.request.Request(
                  "https://api.github.com/graphql", data=gql,
                  headers={**H, "Content-Type": "application/json"})
              gresp = json.load(urllib.request.urlopen(greq))
              errors = gresp.get("errors") or []
              if not errors:
                  print(f"auto-merge armed via GraphQL on PR #{number}")
              elif any("clean status" in e.get("message", "") for e in errors):
                  print("PR already clean; merging directly")
                  st2, mr = api("PUT", f"/repos/{repo}/pulls/{number}/merge",
                                {"merge_method": "merge"})
                  if st2 != 200:
                      raise SystemExit(f"direct merge failed: {st2} {mr}")
                  print(f"PR #{number} merged directly")
              else:
                  raise SystemExit(f"auto-merge failed: {status} {resp}; "
                                   f"graphql: {errors}")
          else:
              raise SystemExit(f"auto-merge enable failed: {status} {resp} "
                               "(is the repo setting 'Allow auto-merge' on?)")

          # CI never starts on the bot-opened PR until a maintainer approves
          # its run once (repo setting "Require approval for all external
          # contributors" covers github-actions[bot] too). Auto-merge is
          # armed, so the PR lands itself right after that approval -- make
          # the pause impossible to miss: annotate this run and record the
          # approve link in the step summary. Best-effort only.
          pr_url = f"https://github.com/{repo}/pull/{number}"
          runs_url = f"{pr_url}/checks"
          try:
              _, full = api("GET", f"/repos/{repo}/pulls/{number}")
              _, rr = api("GET", f"/repos/{repo}/actions/runs"
                          f"?head_sha={full['head']['sha']}")
              pending = [r for r in rr.get("workflow_runs", [])
                         if r.get("event") == "pull_request"
                         and r.get("status") == "action_required"]
              if pending:
                  runs_url = pending[0]["html_url"]
          except Exception:
              pass                          # guidance below still prints
          msg = (f"PR #{number} is opened by github-actions[bot]: approve "
                 f"its CI run once at {runs_url} (Actions > Approve and "
                 "run); auto-merge then lands it automatically")
          print(f"::warning::{msg}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(f"## Sync PR #{number}\n\n{msg}\n\n"
                          "No CI runs on bot-opened PRs until approved "
                          "once; auto-merge is already armed.\n")
          PY
