name: Release

# Rebuild the portable bundle from source and prove it works BEFORE anything
# is published — never ship a stale committed zip.
#
# Runs on:
#   * version tags (v*)  -> build + smoke test + upload + GitHub release
#   * workflow_dispatch  -> build + smoke test only (pre-tag dry run)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build + smoke test portable bundle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 3.12.x must match VER in build_portable.bat (the embeddable zip it
      # downloads). setup-python is also the Tk source install: PY312 points
      # build_portable.bat at it (the script defaults to a developer's
      # LOCALAPPDATA layout otherwise).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate before anything builds or publishes: the tag must match the
      # package version (same script as the tag-check workflow).
      - name: Verify tag matches idm/__init__.py version
        shell: bash
        run: python scripts/check_tag_version.py

      - name: Build portable bundle
        shell: bash
        run: |
          PY312="$(cygpath -w "$(dirname "$(command -v python)")")"
          echo "PY312=$PY312"
          PY312="$PY312" cmd //c build_portable.bat

      - name: Smoke-test the fresh bundle (not a committed artifact)
        shell: bash
        run: |
          cd portable/PyIDM
          sh smoke_test.sh

      - name: Assert zip has a stable PyIDM/ root
        shell: bash
        run: |
          python -c "import zipfile; n = zipfile.ZipFile('portable/PyIDM-portable.zip').namelist(); assert n and all(x.startswith('PyIDM/') for x in n), n[:5]; print('zip root ok:', len(n), 'files')"

      - name: Upload zip as workflow artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: PyIDM-portable-${{ github.ref_name }}
          path: portable/PyIDM-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: portable/PyIDM-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
